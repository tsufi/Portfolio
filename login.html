<!DOCTYPE html>

<html lang="fi">
  <head>
    <title>Portfolio Tsufi</title>
    <link rel="icon" type="image/x-icon" href="img/favicon.ico" />
    <link rel="stylesheet" href="style/Main.css" />
  </head>
  <body>
    <div class="navbar">
      <a href="/index.html">Home</a>
      <a href="/other/Peli/game.html"
        >Tekstiilinlajittelu peli - SaimaanVirta ry</a
      >
      <a href="/login.html">Login</a>
      <a href="/Contact.html">Contact</a>
    </div>
    <div class="contact-box">
      <h2>Login / Register</h2>
      <form id="auth-form" action="/php/account.php" method="post">
        <div class="input-box">
          <input type="email" name="username" id="username" required />
          <label for="username">Email</label>
        </div>
        <div class="input-box">
          <input
            type="password"
            name="password"
            id="password"
            required
            pattern="^(?=.*[A-Z])(?=.*\d)[A-Za-z\d]{8,}$"
            title="Password must be at least 8 characters long and contain at least one number and one uppercase letter."
          />
          <label for="password">Password</label>
        </div>
        <button type="submit" name="action" value="login" class="btn">
          Login
        </button>
        <button type="submit" name="action" value="register" class="btn">
          Register
        </button>
      </form>
      <p id="response-message"></p>
    </div>

    <div class="video-background">
      <video
        src="vid/Firework.mp4"
        id="video1"
        class="myVideo"
        autoplay
        muted
      ></video>
      <video
        src="vid/nothenlights.mp4"
        id="video2"
        class="myVideo"
        autoplay
        muted
      ></video>
      <video
        src="vid/valley.mp4"
        id="video3"
        class="myVideo"
        autoplay
        muted
      ></video>
    </div>
    <script src="scripts/menu.js"></script>
    <script src="scripts/video.js"></script>
  </body>
</html>
